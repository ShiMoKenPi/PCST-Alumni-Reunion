<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>POKEMON BINGO</title>
<style>
  :root{
    --bg:#12141c;
    --panel:#1b1f2b;
    --panel-2:#232837;
    --gold:#d7a34e;
    --gold-dim:#8a6f3c;
    --cream:#f1ede2;
    --muted:#7d8399;
    --lcd:#182620;
    --disp: 'Impact','Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif;
    --body: 'Yu Gothic Medium','Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:radial-gradient(ellipse at 50% -10%, #232a3d 0%, var(--bg) 55%);
    color:var(--cream);
    font-family:var(--body);
    overflow-x:hidden;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    padding:28px 20px 60px;
  }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom:20px; }
  .eyebrow{
    font-family:var(--disp);
    letter-spacing:.35em;
    font-size:17px;
    color:var(--gold-dim);
    margin:0 0 6px;
  }
  h1{
    margin:0;
    font-family:var(--disp);
    font-weight:400;
    font-size:52px;
    letter-spacing:.06em;
    color:var(--cream);
    text-shadow:0 0 18px rgba(215,163,78,.25);
  }
  h1 span{ color:var(--gold); }

  /* ---------- Stage ---------- */
  .stage{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid #2c3245;
    border-radius:20px;
    padding:36px 44px 30px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
    display:flex; flex-direction:column; align-items:center;
    gap:22px;
    margin-bottom:30px;
  }

  .dex-frame{
    position:relative;
    background:#0e1310;
    border-radius:18px;
    padding:16px;
    border:1px solid #2c3245;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .dex-lamp{
    position:absolute; top:14px; left:16px;
    width:10px; height:10px; border-radius:50%;
    background:#c0453a;
    box-shadow:0 0 10px rgba(192,69,58,.8);
  }
  .dex-window{
    width:340px; height:340px;
    overflow:hidden;
    position:relative;
    border-radius:10px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 4px),
      var(--lcd);
    box-shadow:inset 0 0 24px rgba(0,0,0,.6);
  }
  .dex-window::before,
  .dex-window::after{
    content:''; position:absolute; left:0; right:0; height:44px; z-index:2; pointer-events:none;
  }
  .dex-window::before{ top:0; background:linear-gradient(180deg, var(--lcd), transparent); }
  .dex-window::after{ bottom:0; background:linear-gradient(0deg, var(--lcd), transparent); }

  .reel-strip{
    position:absolute; top:0; left:0; width:100%;
    transform:translateY(0);
    will-change:transform;
  }
  .reel-cell{
    width:340px; height:340px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
  }
  .reel-cell img{
    width:240px; height:240px;
    object-fit:contain;
    image-rendering:auto;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));
  }
  .reel-cell span{
    font-family:var(--disp);
    font-size:24px;
    color:var(--gold);
    letter-spacing:.06em;
  }
  .reel-cell.img-missing img{ display:none; }
  .reel-cell.img-missing{
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 8px, transparent 8px 16px);
    border-radius:10px;
  }

  .status-row{
    display:flex; align-items:center; gap:26px;
    font-size:20px; color:var(--muted); letter-spacing:.04em;
  }
  .status-row b{ color:var(--cream); font-weight:600; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--muted); }

  .controls{ display:flex; gap:16px; align-items:center; }
  button{
    font-family:var(--body);
    font-size:20px;
    font-weight:600;
    letter-spacing:.03em;
    border-radius:12px;
    padding:18px 40px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  button:active{ transform:translateY(1px); }
  #drawBtn{
    background:linear-gradient(180deg,#e3ba69,var(--gold));
    color:#241a08;
    box-shadow:0 8px 18px -8px rgba(215,163,78,.7);
  }
  #drawBtn:hover{ filter:brightness(1.06); }
  #drawBtn:disabled{ background:#3a3f4d; color:#7c8194; cursor:not-allowed; box-shadow:none; }
  #resetBtn{
    background:transparent; color:var(--muted);
    border:1px solid #3a3f52;
    padding:17px 28px;
  }
  #resetBtn:hover{ color:var(--cream); border-color:var(--gold-dim); }
  #muteBtn{
    background:transparent; border:1px solid #3a3f52; color:var(--muted);
    width:58px; height:58px; padding:0; border-radius:12px; font-size:22px;
    display:flex; align-items:center; justify-content:center;
  }
  #muteBtn:hover{ color:var(--cream); border-color:var(--gold-dim); }

  /* ---------- History ---------- */
  .history{
    width:100%; max-width:1000px;
    display:flex; align-items:center; gap:14px;
    margin-bottom:26px;
    min-height:62px;
  }
  .history .label{ font-size:15px; color:var(--muted); letter-spacing:.15em; white-space:nowrap; }
  .chips{
    flex:1;
    display:flex; gap:10px; overflow-x:auto; padding:4px 2px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{ display:none; height:0; }
  .chip{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    background:var(--panel-2);
    border:1px solid #2c3245;
    color:var(--muted);
    font-family:var(--disp);
    font-size:18px;
    padding:7px 14px 7px 8px;
    border-radius:9px;
    opacity:0;
    animation:chip-in .3s ease forwards;
  }
  .chip img{ width:34px; height:34px; object-fit:contain; }
  .chip.latest{ background:rgba(215,163,78,.12); border-color:var(--gold-dim); color:var(--gold); font-size:21px; }
  .chip.latest img{ width:42px; height:42px; }
  @keyframes chip-in{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Grid ---------- */
  .grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:12px;
    max-height:calc(100vh - 180px);
    overflow-y:auto;
    padding:4px 4px 30px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .grid::-webkit-scrollbar{ display:none; width:0; }
  .cell{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
    background:var(--panel-2);
    border-radius:12px;
    padding:10px 4px 8px;
  }
  .cell img{
    width:64px; height:64px; object-fit:contain;
    filter:grayscale(1) brightness(.45);
    opacity:.55;
    transition:filter .4s ease, opacity .4s ease, transform .3s ease;
  }
  .cell span{
    font-size:16px; color:#565c72; letter-spacing:.02em;
    font-weight:600;
    transition:color .4s ease;
  }
  .cell.img-missing img{ display:none; }
  .cell.img-missing{
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 6px, var(--panel-2) 6px 12px);
  }
  .cell.drawn img{ filter:none; opacity:1; transform:scale(1.08); }
  .cell.drawn span{ color:var(--gold); font-weight:700; }
  .cell.drawn.fresh{ animation:pop .4s ease; }
  @keyframes pop{ 0%{transform:scale(1.2);} 100%{transform:scale(1);} }

  footer{ margin-top:22px; font-size:12px; color:#4a5066; letter-spacing:.05em; text-align:center; max-width:600px; }

  @media (max-width:520px){
    .dex-window, .reel-cell{ width:220px; height:220px; }
    .reel-cell img{ width:150px; height:150px; }
    h1{ font-size:32px; }
    .list-topbar{ flex-direction:column; gap:12px; }
    .back-btn{ position:static; }
    .list-count{ position:static; }
  }

  @media (prefers-reduced-motion:reduce){
    .reel-strip{ transition:none !important; }
    .cell img, .chip{ transition:none !important; animation:none !important; }
  }

  /* ---------- SPA pages ---------- */
  .page{ display:none; width:100%; }
  .page.active{ display:flex; flex-direction:column; align-items:center; }

  .list-btn{
    flex:0 0 auto;
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold-dim);
    font-family:var(--body);
    font-weight:600;
    font-size:16px;
    padding:10px 20px;
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .list-btn:hover{ background:rgba(215,163,78,.1); }

  #page-list{ max-width:1400px; }
  .list-topbar{
    width:100%;
    display:flex; align-items:center; justify-content:center;
    gap:22px;
    margin-bottom:22px;
    position:relative;
  }
  .list-topbar h2{
    margin:0;
    font-family:var(--disp);
    font-size:30px;
    font-weight:400;
    letter-spacing:.05em;
    color:var(--cream);
  }
  .back-btn{
    position:absolute; left:0;
    background:transparent; color:var(--muted);
    border:1px solid #3a3f52;
    font-family:var(--body);
    font-size:17px; font-weight:600;
    padding:12px 24px;
    border-radius:10px;
    cursor:pointer;
  }
  .back-btn:hover{ color:var(--cream); border-color:var(--gold-dim); }
  .list-count{
    position:absolute; right:0;
    font-size:16px; color:var(--muted);
  }
  .list-count b{ color:var(--gold); font-size:19px; }

  /* ---------- まとめて抽選 ---------- */
  .batch{ display:flex; border:1px solid #3a3f52; border-radius:12px; overflow:hidden; }
  .batch button{
    background:transparent; color:var(--muted); border:none; border-radius:0;
    padding:17px 20px; font-size:18px; letter-spacing:.04em;
  }
  .batch button + button{ border-left:1px solid #3a3f52; }
  .batch button:hover:not(:disabled){ color:var(--cream); }
  .batch button.on{ background:var(--gold); color:#241a08; }
  .batch button:disabled{ cursor:not-allowed; opacity:.5; }
  .batch button.on:disabled{ opacity:.85; }

  .dex-window{ transition:width .3s ease; max-width:100%; }
  .dex-window[data-batch="3"]{ width:min(620px, calc(100vw - 140px)); }
  .dex-window[data-batch="5"]{ width:min(820px, calc(100vw - 140px)); }

  .ball-scenes{ position:absolute; inset:0; display:flex; }
  .ball-scenes .ball-scene{ position:relative; inset:auto; flex:1 1 0; min-width:0; height:100%; }
  .dex-window:not([data-batch="1"]) .ball-wrap{ width:72%; }
  .dex-window:not([data-batch="1"]) .mon img{ width:78%; }
  .dex-window[data-batch="3"] .mon .mname{ font-size:24px; }
  .dex-window[data-batch="3"] .mon .mno{ font-size:13px; }
  .dex-window[data-batch="5"] .mon .mname{ font-size:19px; }
  .dex-window[data-batch="5"] .mon .mno{ font-size:12px; }
  .dex-window:not([data-batch="1"]) .ball-scene.img-missing .mon .mname{ font-size:22px; }

  /* ---------- Poké Ball演出 ---------- */
  .reel-strip{ height:100%; }
  .ball-scene{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .ball-wrap{ position:relative; width:58%; aspect-ratio:1; z-index:1; }
  .ball{ position:absolute; inset:0; filter:drop-shadow(0 10px 14px rgba(0,0,0,.55)); }
  .half{
    position:absolute; inset:0; border-radius:50%;
    border:5px solid #15171d; box-sizing:border-box;
  }
  .half.top{
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.55) 0 6%, transparent 20%),
      linear-gradient(180deg,#f2504a,#c42d28);
    clip-path:inset(0 0 50% 0);
    transform-origin:94% 50%;
  }
  .half.bottom{
    background:
      radial-gradient(circle at 36% 72%, rgba(255,255,255,.8), transparent 45%),
      linear-gradient(180deg,#f7f7f7,#c9ccd3);
    clip-path:inset(50% 0 0 0);
  }
  .half.top::after{ content:''; position:absolute; left:0; right:0; top:44%; height:6%; background:#15171d; }
  .half.bottom::before{ content:''; position:absolute; left:0; right:0; top:0; height:6%; background:#15171d; }
  .ball-btn{
    position:absolute; left:50%; top:50%; width:25%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff, #dfe2e8);
    border:5px solid #15171d; box-sizing:border-box; z-index:2;
  }
  .burst{
    position:absolute; width:95%; aspect-ratio:1; border-radius:50%; z-index:2; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,236,170,.55) 35%, transparent 70%);
  }
  .mon{
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }
  .mon img{ width:60%; aspect-ratio:1; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .mon .mname{ font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; font-weight:800; font-size:30px; color:var(--cream); letter-spacing:.04em; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  .mon .mno{ font-family:var(--disp); font-size:15px; color:var(--gold); letter-spacing:.08em; }
  .ball-scene.img-missing .mon img{ display:none; }
  .ball-scene.img-missing .mon .mname{ font-size:34px; }
  .ball-scene.img-missing .mon .mno{ font-size:22px; }

  /* 待機中: ボールがゆらゆら浮く */
  .ball-scene.idle .ball-wrap{ animation:idle-float 2.6s ease-in-out infinite; }
  @keyframes idle-float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

  /* 抽選中のタイムライン（全体 約2.6秒） */
  .ball-scene.run .ball-wrap{ animation:ball-drop .45s var(--d,0s) ease-out both; }
  .ball-scene.run .ball{ animation:ball-shake .9s calc(.5s + var(--d,0s)) ease-in-out, ball-out .35s calc(1.95s + var(--d,0s)) forwards; }
  .ball-scene.run .half.top{ animation:open-top .35s calc(1.5s + var(--d,0s)) cubic-bezier(.2,1.5,.4,1) forwards; }
  .ball-scene.run .half.bottom{ animation:open-bottom .35s calc(1.5s + var(--d,0s)) ease-out forwards; }
  .ball-scene.run .ball-btn{ animation:btn-off .35s calc(1.2s + var(--d,0s)) ease-in forwards; }
  .ball-scene.run .burst{ animation:burst .8s calc(1.5s + var(--d,0s)) ease-out both; }
  .ball-scene.run .mon img{ animation:mon-in .7s calc(1.55s + var(--d,0s)) cubic-bezier(.2,.9,.3,1.1) both; }
  .ball-scene.run .mon span{ animation:name-in .3s calc(2.1s + var(--d,0s)) both; }

  @keyframes ball-drop{ 0%{ transform:translateY(-70%); opacity:0; } 60%{ opacity:1; } 100%{ transform:translateY(0); opacity:1; } }
  @keyframes ball-shake{
    0%,100%{ transform:rotate(0); }
    12%{ transform:rotate(-14deg); } 25%{ transform:rotate(12deg); }
    37%{ transform:rotate(0); }
    50%{ transform:rotate(-14deg); } 62%{ transform:rotate(12deg); }
    75%{ transform:rotate(-8deg); } 88%{ transform:rotate(6deg); }
  }
  @keyframes ball-out{ to{ opacity:0; } }
  @keyframes open-top{ to{ transform:rotate(22deg) translate(2%,-3%); } }
  @keyframes open-bottom{ to{ transform:translateY(10%); } }
  @keyframes btn-off{
    0%{ box-shadow:0 0 0 rgba(255,255,255,0); }
    60%{ box-shadow:0 0 22px 8px rgba(255,255,255,.95); }
    100%{ box-shadow:0 0 22px 8px rgba(255,255,255,.95); opacity:0; }
  }
  @keyframes burst{ 0%{ opacity:0; transform:scale(.2); } 25%{ opacity:1; } 100%{ opacity:0; transform:scale(1.7); } }
  @keyframes mon-in{
    0%{ opacity:0; transform:translateY(8%) scale(.25); filter:brightness(5) saturate(0); }
    60%{ opacity:1; transform:translateY(-4%) scale(1.08); filter:brightness(2.2) saturate(.4); }
    100%{ opacity:1; transform:none; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  }
  @keyframes name-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* ---------- マスターボール ---------- */
  .ball-scene.master .half{ border-color:#1c1230; }
  .ball-scene.master .half.top{
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 8%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(180deg,#7b49b8 0%,#5a2f93 55%,#43226f 100%);
  }
  .ball-scene.master .half.top::after,
  .ball-scene.master .half.bottom::before{ background:#1c1230; }
  .ball-scene.master .half.bottom{
    background:
      radial-gradient(circle at 34% 70%, rgba(255,255,255,.85), transparent 42%),
      linear-gradient(180deg,#f7f5fb 0%,#dcd6e8 65%,#a79dbd 100%);
  }
  .master-deco{ position:absolute; inset:0; width:100%; height:100%; }
  .ball-scene.master .ball-btn{
    border-color:#1c1230;
    background:radial-gradient(circle, #fff 0 36%, #a9a5ba 39% 56%, #f6f5fa 59% 100%);
  }
  .ball-scene.master .burst{
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,170,230,.6) 35%, rgba(150,90,230,.25) 55%, transparent 72%);
  }

  @media (prefers-reduced-motion: reduce){
    .ball-scene *{ animation:none !important; }
    .ball-scene.run .ball-wrap, .ball-scene.run .burst{ display:none; }
  }
</style>
</head>
<body>

<main id="page-draw" class="page active">

<header>
  <p class="eyebrow">POKEMON BINGO DRAW MACHINE</p>
  <h1>ポケモンビンゴ<span>抽選機</span></h1>
</header>

<div class="stage">
  <div class="dex-frame">
    <div class="dex-lamp"></div>
    <div class="dex-window">
      <div class="reel-strip" id="reelStrip"></div>
    </div>
  </div>

  <div class="status-row">
    <span>残り <b id="remainCount">151</b> / 151</span>
    <span class="dot"></span>
    <span>抽選済み <b id="drawnCount">0</b> 個</span>
  </div>

  <div class="controls">
    <button id="muteBtn" title="音のオン/オフ">🔊</button>
    <div class="batch" id="batch" role="group" aria-label="まとめて抽選する数">
      <button type="button" data-n="1">1匹</button>
      <button type="button" data-n="3">3匹</button>
      <button type="button" data-n="5">5匹</button>
    </div>
    <button id="drawBtn">抽選する</button>
    <button id="resetBtn">リセット</button>
  </div>
</div>

<div class="history">
  <span class="label">履歴</span>
  <div class="chips" id="chips"></div>
  <button id="listBtn" class="list-btn">一覧 ›</button>
</div>

</main>

<main id="page-list" class="page">

  <div class="list-topbar">
    <button id="backBtn" class="back-btn">‹ 戻る</button>
    <h2>番号一覧（No.1〜151）</h2>
    <span class="list-count"><b id="remainCount2">151</b> / 151 残り</span>
  </div>

  <div class="grid" id="grid"></div>

</main>

<script>
(function(){
  const MIN = 1, MAX = 151;
  const NAMES = ['', 'フシギダネ', 'フシギソウ', 'フシギバナ', 'ヒトカゲ', 'リザード', 'リザードン', 'ゼニガメ', 'カメール', 'カメックス', 'キャタピー', 'トランセル', 'バタフリー', 'ビードル', 'コクーン', 'スピアー', 'ポッポ', 'ピジョン', 'ピジョット', 'コラッタ', 'ラッタ', 'オニスズメ', 'オニドリル', 'アーボ', 'アーボック', 'ピカチュウ', 'ライチュウ', 'サンド', 'サンドパン', 'ニドラン♀', 'ニドリーナ', 'ニドクイン', 'ニドラン♂', 'ニドリーノ', 'ニドキング', 'ピッピ', 'ピクシー', 'ロコン', 'キュウコン', 'プリン', 'プクリン', 'ズバット', 'ゴルバット', 'ナゾノクサ', 'クサイハナ', 'ラフレシア', 'パラス', 'パラセクト', 'コンパン', 'モルフォン', 'ディグダ', 'ダグトリオ', 'ニャース', 'ペルシアン', 'コダック', 'ゴルダック', 'マンキー', 'オコリザル', 'ガーディ', 'ウインディ', 'ニョロモ', 'ニョロゾ', 'ニョロボン', 'ケーシィ', 'ユンゲラー', 'フーディン', 'ワンリキー', 'ゴーリキー', 'カイリキー', 'マダツボミ', 'ウツドン', 'ウツボット', 'メノクラゲ', 'ドククラゲ', 'イシツブテ', 'ゴローン', 'ゴローニャ', 'ポニータ', 'ギャロップ', 'ヤドン', 'ヤドラン', 'コイル', 'レアコイル', 'カモネギ', 'ドードー', 'ドードリオ', 'パウワウ', 'ジュゴン', 'ベトベター', 'ベトベトン', 'シェルダー', 'パルシェン', 'ゴース', 'ゴースト', 'ゲンガー', 'イワーク', 'スリープ', 'スリーパー', 'クラブ', 'キングラー', 'ビリリダマ', 'マルマイン', 'タマタマ', 'ナッシー', 'カラカラ', 'ガラガラ', 'サワムラー', 'エビワラー', 'ベロリンガ', 'ドガース', 'マタドガス', 'サイホーン', 'サイドン', 'ラッキー', 'モンジャラ', 'ガルーラ', 'タッツー', 'シードラ', 'トサキント', 'アズマオウ', 'ヒトデマン', 'スターミー', 'バリヤード', 'ストライク', 'ルージュラ', 'エレブー', 'ブーバー', 'カイロス', 'ケンタロス', 'コイキング', 'ギャラドス', 'ラプラス', 'メタモン', 'イーブイ', 'シャワーズ', 'サンダース', 'ブースター', 'ポリゴン', 'オムナイト', 'オムスター', 'カブト', 'カブトプス', 'プテラ', 'カビゴン', 'フリーザー', 'サンダー', 'ファイヤー', 'ミニリュウ', 'ハクリュー', 'カイリュー', 'ミュウツー', 'ミュウ'];   // 番号 → 名前（初代151匹）
  const nameOf = n => NAMES[n] || ('No.' + n);
  const MASTER_BALL_NUMBERS = [150, 151]; // マスターボールで登場させるポケモン番号（ミュウツー・ミュウ）

  // ==== 画像パス設定 ====
  const IMAGE_FOLDER = './data/pic/';
  const PAD = 3; // 画面表示用(No.001)の桁数。画像ファイル名には使いません
  const EXT = '.png';
  function imgSrc(n){ return IMAGE_FOLDER + n + EXT; } // 1.png, 2.png ... （0埋めなし）
  function padNo(n){ return 'No.' + String(n).padStart(PAD, '0'); }
  // ======================

  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  const muteBtn = document.getElementById('muteBtn');
  const remainCountEl = document.getElementById('remainCount');
  const remainCountEl2 = document.getElementById('remainCount2');
  const drawnCountEl = document.getElementById('drawnCount');
  const chipsEl = document.getElementById('chips');
  const gridEl = document.getElementById('grid');
  const reelStrip = document.getElementById('reelStrip');
  const dexWindowEl = document.querySelector('.dex-window');
  const pageDraw = document.getElementById('page-draw');
  const pageList = document.getElementById('page-list');
  const listBtn = document.getElementById('listBtn');
  const backBtn = document.getElementById('backBtn');

  let remaining = [];
  let drawnHistory = [];
  let animating = false;
  let muted = false;
  let audioCtx = null;
  let resetToken = 0; // インクリメントすることで進行中の抽選を無効化する
  let batchSize = 1;  // 1回の抽選で出す数（1 / 3 / 5）
  let lastBatch = 1;  // 直前の抽選で出した数（履歴の強調表示に使う）
  const STAGGER = 0.1; // 複数のボールを少しずつずらして開く（秒）
  const batchEl = document.getElementById('batch');

  function resetState(){
    remaining = [];
    for(let n = MIN; n <= MAX; n++) remaining.push(n);
    drawnHistory = [];
  }

  function buildGrid(){
    gridEl.innerHTML = '';
    for(let n = MIN; n <= MAX; n++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-' + n;
      cell.innerHTML =
        '<img src="' + imgSrc(n) + '" alt="' + padNo(n) + '" ' +
        'onerror="this.closest(\'.cell\').classList.add(\'img-missing\')">' +
        '<span>' + n + '</span>';
      gridEl.appendChild(cell);
    }
  }

  function renderCounts(){
    remainCountEl.textContent = remaining.length;
    if(remainCountEl2) remainCountEl2.textContent = remaining.length;
    drawnCountEl.textContent = drawnHistory.length;
  }

  function renderChips(){
    chipsEl.innerHTML = '';
    const recent = drawnHistory.slice(-Math.max(10, lastBatch)).reverse();
    recent.forEach((n, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (i < lastBatch ? ' latest' : '');
      chip.innerHTML =
        '<img src="' + imgSrc(n) + '" alt="" onerror="this.style.display=\'none\'">' +
        '<span>' + padNo(n) + '</span>';
      chipsEl.appendChild(chip);
    });
  }

  function markCellDrawn(n){
    const cell = document.getElementById('cell-' + n);
    if(!cell) return;
    cell.classList.add('drawn', 'fresh');
    setTimeout(() => cell.classList.remove('fresh'), 420);
  }

  function clearGridDrawn(){
    document.querySelectorAll('.cell.drawn').forEach(c => c.classList.remove('drawn'));
    document.querySelectorAll('.cell.img-missing').forEach(c => c.classList.remove('img-missing'));
  }

  // --- sound ---
  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function beep(freq, dur, vol, type){
    if(muted) return;
    try{
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain).connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t);
      osc.stop(t + dur);
    }catch(e){ /* audio unavailable, ignore */ }
  }
  function swooshSound(){
    if(muted) return;
    try{
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      const t = audioCtx.currentTime;
      osc.frequency.setValueAtTime(700, t);
      osc.frequency.exponentialRampToValueAtTime(140, t + 0.5);
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.5);
    }catch(e){}
  }
  function landSound(){ beep(660, 0.18, 0.07, 'triangle'); setTimeout(() => beep(880, 0.22, 0.06, 'triangle'), 90); }

  // --- モンスターボール演出 ---
  function sceneMarkup(n, mode, i){
    i = i || 0;
    const mon = (mode === 'run')
      ? '<div class="burst"></div>' +
        '<div class="mon"><img src="' + imgSrc(n) + '" alt="' + padNo(n) + '" ' +
        'onerror="this.closest(\'.ball-scene\').classList.add(\'img-missing\')">' +
        '<span class="mname">' + nameOf(n) + '</span><span class="mno">' + padNo(n) + '</span></div>'
      : '';
    const isMaster = (mode === 'run') && MASTER_BALL_NUMBERS.indexOf(n) !== -1;
    const mMark = isMaster
      ? '<svg class="master-deco" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="pinkDome' + i + '" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#ff9fd2"/><stop offset=".42" stop-color="#e5429f"/><stop offset="1" stop-color="#b02a85"/></radialGradient></defs><g transform="rotate(-36 20 19)"><ellipse cx="20" cy="19" rx="18" ry="13.5" fill="url(#pinkDome' + i + ')" stroke="#2c1450" stroke-width="2.2"/><ellipse cx="15" cy="14.5" rx="9" ry="3.6" fill="#ffd3ec" opacity=".6"/></g><g transform="rotate(36 80 21)"><ellipse cx="80" cy="21" rx="19" ry="15" fill="url(#pinkDome' + i + ')" stroke="#2c1450" stroke-width="2.2"/><ellipse cx="74" cy="15.5" rx="10" ry="4" fill="#ffd3ec" opacity=".6"/></g><path d="M38.5 34 L41.5 15 L50 26 L58.5 15 L61.5 34" fill="none" stroke="#2c1450" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round" opacity=".45"/><path d="M38 33 L41 14 L50 25 L59 14 L62 33" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/></svg>'
      : '';
    return '<div class="ball-scene ' + mode + (isMaster ? ' master' : '') + '" style="--d:' + (i * STAGGER).toFixed(2) + 's">' +
      '<div class="ball-wrap"><div class="ball">' +
      '<div class="half top">' + mMark + '</div><div class="half bottom"></div><div class="ball-btn"></div>' +
      '</div></div>' + mon + '</div>';
  }

  function scenesMarkup(nums, mode){
    return '<div class="ball-scenes">' + nums.map((n, i) => sceneMarkup(n, mode, i)).join('') + '</div>';
  }

  function showIdleBall(){
    reelStrip.innerHTML = scenesMarkup(new Array(batchSize).fill(0), 'idle');
  }

  // nums: 今回出すポケモン番号の配列（1〜5個）。全部のボールが開き終わったら解決する
  function spinTo(nums){
    return new Promise(resolve => {
      reelStrip.innerHTML = scenesMarkup(nums, 'run');

      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce){ landSound(); setTimeout(resolve, 400); return; }

      swooshSound(); // ボールが落ちてくる音（クリック直後に鳴らして音声を有効化）
      [650, 1000, 1350].forEach(t => setTimeout(() => beep(260, 0.07, 0.05, 'square'), t)); // ガタガタ
      nums.forEach((n, i) => {
        const at = 1500 + i * STAGGER * 1000;
        setTimeout(landSound, at);                                                          // パカッ
        if(MASTER_BALL_NUMBERS.indexOf(n) !== -1){                                          // マスターボール用の追加音
          setTimeout(() => beep(1320, 0.35, 0.06, 'triangle'), at + 150);
          setTimeout(() => beep(1760, 0.45, 0.05, 'triangle'), at + 300);
        }
      });
      setTimeout(resolve, 2700 + (nums.length - 1) * STAGGER * 1000);
    });
  }

  function updateDrawLabel(){
    if(remaining.length === 0){ drawBtn.textContent = 'ビンゴ終了'; return; }
    const k = Math.min(batchSize, remaining.length);
    drawBtn.textContent = k === 1 ? '抽選する' : k + '匹まとめて抽選';
  }

  function setBatchButtonsDisabled(v){
    batchEl.querySelectorAll('button').forEach(b => { b.disabled = v; });
  }

  async function handleDraw(){
    if(animating) return;
    if(remaining.length === 0) return;
    animating = true;
    const myToken = resetToken;
    drawBtn.disabled = true;
    setBatchButtonsDisabled(true);

    // 残りから、重複しないように k 個を選ぶ
    const k = Math.min(batchSize, remaining.length);
    const picked = [];
    for(let i = 0; i < k; i++){
      const idx = Math.floor(Math.random() * remaining.length);
      picked.push(remaining.splice(idx, 1)[0]);
    }

    await spinTo(picked);

    if(myToken !== resetToken){
      // この間にリセットされていた場合は結果を反映しない
      return;
    }

    picked.forEach(n => { drawnHistory.push(n); markCellDrawn(n); });
    lastBatch = picked.length;
    renderCounts();
    renderChips();
    if(window.publishState) window.publishState(drawnHistory.slice()); // Firebaseへ送信（まとめて1回）

    animating = false;
    setBatchButtonsDisabled(false);
    if(remaining.length === 0){
      drawBtn.disabled = true;
    }else{
      drawBtn.disabled = false;
    }
    updateDrawLabel();
  }

  function handleReset(){
    if(drawnHistory.length > 0 || animating){
      const ok = window.confirm('抽選履歴をすべてリセットします。よろしいですか？');
      if(!ok) return;
    }
    resetToken++; // 進行中の抽選があれば結果を無効化する
    animating = false;
    resetState();
    if(window.publishReset) window.publishReset(); // Firebaseもリセット
    clearGridDrawn();
    showIdleBall();
    renderCounts();
    renderChips();
    drawBtn.disabled = false;
    setBatchButtonsDisabled(false);
    lastBatch = 1;
    updateDrawLabel();
  }

  function toggleMute(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }

  function showListPage(){
    pageDraw.classList.remove('active');
    pageList.classList.add('active');
    window.scrollTo(0, 0);
  }
  function showDrawPage(){
    pageList.classList.remove('active');
    pageDraw.classList.add('active');
    window.scrollTo(0, 0);
  }

  listBtn.addEventListener('click', showListPage);
  backBtn.addEventListener('click', showDrawPage);

  function setBatch(n, save){
    batchSize = n;
    dexWindowEl.dataset.batch = String(n);
    batchEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.n) === n));
    if(save){ try{ localStorage.setItem('pokebingo_batch', String(n)); }catch(e){} }
    updateDrawLabel();
    if(!animating) showIdleBall();
  }
  batchEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b || b.disabled || animating) return;
    setBatch(Number(b.dataset.n), true);
  });

  drawBtn.addEventListener('click', handleDraw);
  resetBtn.addEventListener('click', handleReset);
  muteBtn.addEventListener('click', toggleMute);

  // ページを開き直したときに、Firebaseの内容から状態を復元する
  window.restoreState = function(drawn){
    drawnHistory = drawn.slice();
    remaining = [];
    for(let n = MIN; n <= MAX; n++){
      if(drawnHistory.indexOf(n) === -1) remaining.push(n);
    }
    clearGridDrawn();
    drawnHistory.forEach(n => {
      const cell = document.getElementById('cell-' + n);
      if(cell) cell.classList.add('drawn');
    });
    renderCounts();
    renderChips();
    if(remaining.length === 0) drawBtn.disabled = true;
    updateDrawLabel();
  };

  resetState();
  buildGrid();
  let savedBatch = 1;
  try{ savedBatch = Number(localStorage.getItem('pokebingo_batch')) || 1; }catch(e){}
  setBatch([1, 3, 5].indexOf(savedBatch) !== -1 ? savedBatch : 1, false);   // 前回の選択を復元（showIdleBallもここで呼ばれる）
  renderCounts();
  renderChips();
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// ▼▼ ここをFirebaseコンソールで取得した値に差し替えてください ▼▼
const firebaseConfig = {
  apiKey: "AIzaSyAenxvQQLc_2LAzayWXfE97lMr-mFqdtrk",
  authDomain: "pcst-alumni-reunion.firebaseapp.com",
  databaseURL: "https://pcst-alumni-reunion-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pcst-alumni-reunion",
  storageBucket: "pcst-alumni-reunion.firebasestorage.app",
  messagingSenderId: "167272759038",
  appId: "1:167272759038:web:d34c428e0b10af0bd02faf"
};
const ADMIN_EMAIL = "chomechome047@gmail.com"; // Authenticationで作成した管理者のメールアドレス
// ▲▲ ここまで ▲▲

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const stateRef = ref(db, "bingo/state");
let round = Date.now();

try{
  const pw = prompt("管理者パスワードを入力してください");
  await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pw);

  // 既存データがあれば復元（ページを開き直しても続きから再開できる）
  const snap = await get(stateRef);
  const cur = snap.val();
  if(cur && cur.round){
    round = cur.round;
    if(cur.drawn && cur.drawn.length) window.restoreState(cur.drawn);
  }else{
    await set(stateRef, { round, drawn: [], updatedAt: Date.now() });
  }

  window.publishState = (drawn) =>
    set(stateRef, { round, drawn, updatedAt: Date.now() })
      .catch(e => { console.error(e); alert("Firebaseへの送信に失敗しました。通信状況を確認してください。"); });

  window.publishReset = () => {
    round = Date.now();
    return set(stateRef, { round, drawn: [], updatedAt: Date.now() })
      .catch(e => { console.error(e); alert("Firebaseのリセットに失敗しました。"); });
  };
}catch(e){
  console.error(e);
  alert("Firebaseに接続できませんでした。設定値・パスワードを確認してください。\n（このままでも抽選はできますが、シートには反映されません）");
}
</script>
